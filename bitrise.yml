format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  primary:
    summary: Build FocusGuard Android APK & AAB
    description: Full CI workflow to compile Vite assets, sync Capacitor, and build Android APK/AAB with Gradle.
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: {}
      - npm@1:
          title: Install npm dependencies
          inputs:
            command: install --legacy-peer-deps
      - npm@1:
          title: Build web assets (Vite)
          inputs:
            command: run build
      - script@1:
          title: Sync Capacitor Android
          inputs:
            content: |
              #!/usr/bin/env bash
              set -ex
              npx cap sync android
      - install-missing-android-tools@3:
          inputs:
            gradlew_path: ./android/gradlew
      - android-build@1:
          title: Build Android APK
          inputs:
            project_location: ./android
            module: app
            variant: debug
            build_type: apk
      - deploy-to-bitrise-io@2:
          inputs:
            notify_user_groups: none
            is_compress: "true"
