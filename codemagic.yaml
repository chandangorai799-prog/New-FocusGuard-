workflows:
  android-release-apk:
    name: FocusGuard Android Release APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 21
      node: 20
      groups:
        - google_play # Optional: For signed releases
      vars:
        PACKAGE_NAME: "com.focusguard.studyapp"
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Build web application
        script: |
          # Build the production web assets into dist/
          npm run build
      - name: Set up Capacitor Android platform
        script: |
          # Install stable Capacitor 6 LTS packages compatible with Android build tools
          npm install @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0 --save

          # Initialize Android project if not present, then sync web build
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Configure Android Signing & Gradle
        script: |
          # Ensure Gradle daemon memory configuration
          echo "org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties

          if [ -n "$CM_KEYSTORE" ] && [ -n "$CM_KEYSTORE_PASSWORD" ] && [ -n "$CM_KEY_ALIAS" ] && [ -n "$CM_KEY_PASSWORD" ]; then
            echo "Setting up release signing keystore..."
            echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.keystore
            cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  release {
                      storeFile file('/tmp/keystore.keystore')
                      storePassword '$CM_KEYSTORE_PASSWORD'
                      keyAlias '$CM_KEY_ALIAS'
                      keyPassword '$CM_KEY_PASSWORD'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          else
            echo "No custom keystore provided. Configuring release to use debug keystore for installable testing APK..."
            cat >> android/app/build.gradle <<EOF

          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF
          fi
      - name: Build Android APK with Gradle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
      - android/app/build/outputs/mapping/**/*.txt
    publishing:
      email:
        recipients:
          - chandangorai799@gmail.com
        notify:
          success: true
          failure: true
