workflows:
  android-release-apk:
    name: FocusGuard Android Release APK
    max_build_duration: 60
    instance_type: linux
    environment:
      java: 17
      node: 20
      groups:
        - google_play # Optional: For signed releases
      vars:
        PACKAGE_NAME: "com.focusguard.studyapp"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 --save
      - name: Build web application
        script: |
          # Build web assets with vite into dist/
          npm run build
      - name: Set up Capacitor Android platform
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Configure Android Signing & Gradle
        script: |
          # Ensure Gradle memory limits
          mkdir -p android
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties

          if [ -n "$CM_KEYSTORE" ] && [ -n "$CM_KEYSTORE_PASSWORD" ] && [ -n "$CM_KEY_ALIAS" ] && [ -n "$CM_KEY_PASSWORD" ]; then
            echo "Setting up release signing keystore..."
            echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.keystore
            cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  release {
                      storeFile file('/tmp/keystore.keystore')
                      storePassword '$CM_KEYSTORE_PASSWORD'
                      keyAlias '$CM_KEY_ALIAS'
                      keyPassword '$CM_KEY_PASSWORD'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          else
            echo "No custom keystore provided. Configuring release to use debug keystore..."
            cat >> android/app/build.gradle <<EOF

          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF
          fi
      - name: Build Android APK with Gradle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - chandangorai799@gmail.com
        notify:
          success: true
          failure: true
