workflows:
  android-release-apk:
    name: FocusGuard Android APK Build
    max_build_duration: 60
    instance_type: linux
    environment:
      java: 17
      node: 20
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.focusguard.app"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web application
        script: |
          npm run build
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Build Android APK with Gradle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - chandangorai799@gmail.com
        notify:
          success: true
          failure: true
