workflows:
  android-release-apk:
    name: FocusGuard Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
      node: 20
      groups:
        - google_play # Optional: For signed releases
      vars:
        PACKAGE_NAME: "com.focusguard.studyapp"
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Build web application
        script: |
          # Build the production web assets into dist/
          npm run build
      - name: Set up Capacitor Android platform
        script: |
          # Install Capacitor CLI and Android core libraries if not already in node_modules
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Add android platform if directory does not exist, otherwise sync
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Set up Android keystore (Optional Signing)
        script: |
          if [ -n "$CM_KEYSTORE" ] && [ -n "$CM_KEYSTORE_PASSWORD" ] && [ -n "$CM_KEY_ALIAS" ] && [ -n "$CM_KEY_PASSWORD" ]; then
            echo "Setting up release signing keystore..."
            echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.keystore
            cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  release {
                      storeFile file('/tmp/keystore.keystore')
                      storePassword '$CM_KEYSTORE_PASSWORD'
                      keyAlias '$CM_KEY_ALIAS'
                      keyPassword '$CM_KEY_PASSWORD'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          else
            echo "No custom keystore provided. Building unsigned release / assembleRelease APK."
          fi
      - name: Build Android Release APK with Gradle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - ${CM_USER_EMAIL:-chandangorai799@gmail.com}
        notify:
          success: true
          failure: true
